# Wicchu marketing site, Flutter web app, and API.
server {
    server_name wicchu.com www.wicchu.com api.wicchu.com;

    client_max_body_size 100M;

    location = /app {
        return 308 /app/;
    }

    # Flutter entry points are replaced on every deployment. They must be
    # revalidated so Cloudflare and browsers do not bootstrap an old build.
    location ~ ^/app/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js)$ {
        root /var/www/wicchu;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /app/ {
        root /var/www/wicchu;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/wicchu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wicchu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.wicchu.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.wicchu.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = wicchu.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name wicchu.com www.wicchu.com api.wicchu.com;
    return 404;
}
